name: Bug / 缺陷
description: 报告可复现缺陷（公开仓库入口）
title: "[bug] "
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：用的是最新 Release / kit 版本？问题能否稳定复现？
  - type: input
    id: version
    attributes:
      label: 版本
      description: kit 版本（dist/covenant-kit-x.y.z）、commit 或 Release tag
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 命令 + 输入；能最小化最好（附 .cvn.yaml 片段）。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际（含错误输出/截图）
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node 版本；浏览器问题请注明浏览器/版本。
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 只贴关键片段；大文件请给链接。
