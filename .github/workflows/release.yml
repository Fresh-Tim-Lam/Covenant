name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Build kit
        run: node scripts/build-kit.mjs

      - name: Package zip + checksum
        run: |
          cd dist
          zip -r covenant-kit-0.1.0.zip covenant-kit-0.1.0
          sha256sum covenant-kit-0.1.0.zip > covenant-kit-0.1.0.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/covenant-kit-0.1.0.zip
            dist/covenant-kit-0.1.0.zip.sha256
          fail_on_unmatched_files: true