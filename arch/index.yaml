      - 关系 id 匹配 ^r\.[a-z][a-z0-9-]{0,62}$；summary 必填；分片内禁反引号与 ${
      - 依赖 apply 层 appendRelations（E9 修复），patch add 才能落进 relations 块
    source_sha256: 943a93cd77208141cd6a3895d975ef91514fd7e87662a26e2e11a8b861de0547
