      - packages/render/src/html.ts
      - packages/render/src/viewer.css.ts
    a:
      - packages/render/src/html.ts
    s:
      - 只进暂存，绝不修改 DATA.docs（构建产物副本，只读语义）
      - 被批注/relation/frame 引用的元素禁止暂存删除，否则 kernel/dangling-ref 拒收
      - 新增 id 必须匹配 ^e\.[a-z][a-z0-9-]{0,62}$；add 走 /elements/-，remove 走 /elements/<id>，两者不得并发 replace
      - 与 editOps 的 set 编辑通道严格分离，不得混用
    source_sha256: b95755b392e6d3406b4281f60940cbfd5e9d2ae0b2e59698bea166b3953726b9
  - file: packages/render/src/viewer/script-elem-toolbar.ts
