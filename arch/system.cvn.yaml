  - id: r.cli-core
    kind: calls
    from: e.cli
    to: e.core
    summary: 解析与类型
  - id: r.cli-validate
    kind: calls
    from: e.cli
    to: e.validate
    summary: 校验
  - id: r.cli-layout
    kind: calls
    from: e.cli
    to: e.layout
    summary: 布局
  - id: r.cli-render
    kind: calls
    from: e.cli
    to: e.render
    summary: 渲染
  - id: r.cli-patch
    kind: calls
    from: e.cli
    to: e.patch
    summary: 补丁门禁与应用
  - id: r.cli-diff
    kind: calls
    from: e.cli
    to: e.diff
