# Covenant 自举契约：用 Covenant 描述 Covenant 仓库自身。
# 这张图不是"示意"，它受 `covenant check` 与 CI 保护；改代码结构时应同步改这里。
covenant: "0.1"
id: covenant/self
profile: c4-container@1

meta:
  title: Covenant 系统结构
  purpose: 说明仓库自身的组件边界、依赖方向与已知缺口，作为人/AI 的共同基线。
  non_goals:
    - 运行时部署拓扑（本项目是本地工具，无服务端部署）
    - 函数级调用细节（由代码与 FRAS 索引承载）
  audience: [human, ai]
  status: draft
  rev: 7
  owners: [human:team]
  updated: 2026-11-03T22:20:00+08:00
  ai:
    summary: |
      单文件 HTML 优先的契约式图示工具：.cvn.yaml 为唯一事实源，
      渲染在构建期完成，浏览器端只做标注与导出补丁。
      依赖方向 core ← profile/validate/layout/render/patch/diff/indexer/ai/adr/editor ← cli/mcp；
      cli 与 mcp 是并列前端，均直接依赖库包（mcp 不经 CLI 进程）。
      交付链：cli build/bundle → dist 产物；scripts/build-kit → kit；GitHub Actions 负责 verify 与 Release。
      浏览器查看器内部架构（v.viewer）：外壳装配 canvas / sidebar / inspector / annot-editor / export；
      inspector 下分窗口管理器（三态/级联/置顶）、颜色系统（8 色+400ms 色忆）、引导线 overlay；
      seg-annot 提供段热区与段窗；annot-editor 经 serve 写回，export 导出补丁/编辑 JSON。
      编辑态经 serve --edit 写回，离线导出 .patch.json / edits.json 后由 CLI 落盘。

elements:
  - id: e.human
    kind: person
    name: 人工架构师
    summary: 在 HTML 图上标注问题、审批 breaking 变更

  - id: e.agent
    kind: person
    name: AI Agent
    summary: 读语义副本、提交补丁（受门禁约束）
    tech: MCP / CLI

  - id: e.cli
    kind: container
    name: covenant CLI
    summary: 命令入口：check/render/build/bundle/apply/patch-check/diff/index/ai/adr/edit/doctor/serve
    tech: TypeScript + tsx

  - id: e.mcp
    kind: container
    name: MCP server
    summary: stdio 进程，暴露 9 个工具（brief/check/read_doc/render/build/patch_check/apply/diff/index）
    tech: TypeScript + JSON-RPC

  - id: e.viewer
    kind: container
    name: 浏览器查看器
    summary: 内联于 dist HTML/bundle 的查看器外壳：装配画布/侧栏/小窗/批注编辑/导出，路由指针与键盘事件；编辑态经 serve 写回、离线导出补丁
    tech: 内联 TS + SVG

  - id: e.inspector
    kind: container
    name: 小窗系统（inspector）
    summary: 小窗系统外壳：装配窗口管理器、颜色系统与引导线 overlay，驱动段窗与新增批注表单折叠
    tech: 内联 TS + SVG overlay

  - id: e.win-manager
    kind: container
    name: 窗口管理器
    summary: wins[] 数组与三态流转（hover 预览 → clicked 保留 → 📌 pinned）、级联偏移 +18、点击置顶、× 只关自己、切图清空
    tech: 内联 TS

  - id: e.color-sys
    kind: container
    name: 颜色系统
    summary: 8 色确定性调色板（未占用优先、满 8 循环）、400ms 色忆防闪、同色贯穿窗口/锚点高亮/引导线
    tech: 内联 TS

  - id: e.guide-overlay
    kind: container
    name: 引导线 overlay
    summary: "#insp-guides SVG：窗口最近边中点 → 锚点（元素中心/整边弧长 t=0.5/段中点），拖拽/缩放/平移/resize/侧栏折叠实时更新"
    tech: 内联 TS + SVG

  - id: e.sidebar
    kind: container
    name: 侧栏文档分组
    summary: docGroup 优先级（meta.group → 源路径 → 命名空间）、GROUP_ORDER（自身架构/系统契约/示例演示/模板/其他）、组标题不可点、当前组高亮、切图
    tech: 内联 TS

  - id: e.seg-annot
    kind: container
    name: 段级批注
    summary: 运行时 .seg-hit 段热区（不改静态 SVG）、段窗 (relation,id,segment)、badge 按段计数、本段/整边范围切换
    tech: 内联 TS

  - id: e.annot-editor
    kind: container
    name: 批注编辑流
    summary: 内联编辑（保存/←返回/删除撤销/回收桶）、状态流转、新增表单折叠、localStorage 暂存 → 导出 patch / serve 写回
    tech: 内联 TS

  - id: e.canvas
    kind: container
    name: 画布交互
    summary: 缩放（0.15–4）/平移/双击适配、拖拽节点改写 pins（编辑态）、键盘 Esc 关窗
    tech: 内联 TS + SVG

  - id: e.export
    kind: container
    name: 导出
    summary: 导出补丁 JSON（.patch.json 下载）/ 编辑 JSON（edits.json），离线写回通道
    tech: 内联 TS

  - id: e.doc-data
    kind: datastore
    name: 内嵌产物数据
    summary: HTML 内联 JSON：docs 的 elements/relations/annotations/views/layout/anchors/centers/segments
    tech: 内联 JSON
    props: { storage_kind: file }

  - id: e.serve
    kind: container
    name: covenant serve
    summary: CLI 的本地 HTTP 模式：静态托管 dist + 短时编辑态 API（/api/edit、/api/patch；loopback + token，写前校验/备份/审计）
    tech: Node / HTTP

  - id: e.core
    kind: container
    name: core
    summary: 类型、YAML 解析（CORE_SCHEMA）、finding 排序、仓库根定位
    tech: TypeScript

  - id: e.profile
    kind: container
    name: profile
    summary: 剖面注册表与专有规则（c4-container/dfd/er/flowchart/deployment/graph/sequence/state 等）
    tech: TypeScript

  - id: e.validate
    kind: container
    name: validate
    summary: L1 schema（ajv）/ L2 完整性 / L3 剖面一致性
    tech: TypeScript + ajv

  - id: e.layout
    kind: container
    name: layout
    summary: 分层布局、barycenter 交叉最小化、长边通道、视图选择器、序列图专用布局
    tech: TypeScript

  - id: e.render
    kind: container
    name: render
    summary: SVG 渲染 + 可标注自包含 HTML（单文件查看器）
    tech: TypeScript

  - id: e.patch
    kind: container
    name: patch
    summary: 补丁门禁、状态流转、保留注释的文本块落盘与 write-ahead 审计
    tech: TypeScript

  - id: e.diff
    kind: container
    name: diff
    summary: 语义 diff（cosmetic / material / breaking）
    tech: TypeScript

  - id: e.indexer
    kind: container
    name: indexer
    summary: FRAS 索引生成与 I1–I3 校验（覆盖 / 新鲜度 / 可读性）
    tech: TypeScript

  - id: e.ai
    kind: container
    name: ai
    summary: 本地 AI 协作：评审简报与 AI 批注补丁构造（不联网）
    tech: TypeScript

  - id: e.adr
    kind: container
    name: adr
    summary: ADR front-matter 解析与校验（编号 / 状态 / supersedes / accepted 引用）
    tech: TypeScript

  - id: e.editor
    kind: container
    name: editor
    summary: 受控语义编辑（属性 / pins）+ YAML 序列化 + 统一 diff
    tech: TypeScript

  - id: e.kitbuild
    kind: container
    name: 可交付包构建
    summary: scripts/build-kit.mjs：esbuild 单文件 CLI + viewer + schema/模板/示例/docs → dist/covenant-kit-*
    tech: Node + esbuild

  - id: e.ci
    kind: container
    name: GitHub Actions
    summary: verify.yml（typecheck/verify/kit 构建上传）与 release.yml（tag → kit → zip/sha → Release）
    tech: GitHub Actions

  - id: e.docs
    kind: datastore
    name: .cvn.yaml 契约文件
    summary: 唯一权威事实源：项目内 .cvn.yaml（arch/、examples/、用户项目）
    tech: YAML
    props: { storage_kind: file }
    tags: [critical]

  - id: e.index
    kind: datastore
    name: FRAS 索引
    summary: arch/index.yaml，记录源码文件的 F/R/A/S 与哈希
    tech: YAML
    props: { storage_kind: file }

  - id: e.audit
    kind: datastore
    name: 审计日志
    summary: 手搓 write-ahead 审计 .audit/*.jsonl（intent→rename→commit）与编辑备份；git 仅用于 diff 展示
    tech: JSONL
    props: { storage_kind: file }

  - id: e.html
    kind: datastore
    name: 自包含 HTML
    summary: dist/covenant.html 单文件（默认产物；离线可标注）
    tech: HTML + inline SVG
    props: { storage_kind: file }

  - id: e.bundle
    kind: datastore
    name: 文件夹站点
    summary: dist/site/（index.html + manifest.json v3 + views/*.svg + annotations.json），第二产物模式
    tech: HTML + SVG + JSON
    props: { storage_kind: file }

  - id: e.patchfile
    kind: datastore
    name: 补丁/编辑文件
    summary: viewer 导出的 .patch.json / edits.json；covenant apply / patch-check / edit 读取后落盘
    tech: JSON
    props: { storage_kind: file }

  - id: e.kit
    kind: datastore
    name: 可交付包
    summary: dist/covenant-kit-<ver>/ 与 .zip/.sha256（可移植交付包 / Release 资产）
    tech: 文件目录 + ZIP
    props: { storage_kind: file }

  - id: e.github
    kind: external-system
    name: GitHub（Releases / Issues）
    summary: 公开分发与反馈通道：Release 上传 kit 资产、Issue 收集需求（外部不可信输入）

relations:
  - id: r.human-cli
    kind: calls
    from: e.human
    to: e.cli
    summary: 运行命令、审批变更

  - id: r.agent-cli
    kind: calls
    from: e.agent
    to: e.cli
    summary: 通过 CLI 提交补丁

  - id: r.agent-mcp
    kind: calls
    from: e.agent
    to: e.mcp
    summary: 通过 MCP 工具调用（9 个工具）

  - id: r.human-viewer
