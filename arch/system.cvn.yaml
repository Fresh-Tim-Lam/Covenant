  - id: r.agent-mcp
    kind: calls
    from: e.agent
    to: e.mcp
    summary: 通过 MCP 工具调用（9 个工具）

  - id: r.human-viewer
    kind: calls
    from: e.human
    to: e.viewer
    summary: 双击 HTML / 打开 bundle 进入查看与标注

  - id: r.cli-core
    kind: calls
    from: e.cli
    to: e.core
    summary: 解析与类型
  - id: r.cli-validate
    kind: calls
    from: e.cli
    to: e.validate
