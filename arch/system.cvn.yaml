    to: e.color-sys
    summary: 新窗分配 / 复用颜色
  - id: r.win-manager-guide
    kind: calls
    from: e.win-manager
    to: e.guide-overlay
    summary: 打开/关闭/拖拽/置顶时驱动引导线
  - id: r.guide-overlay-data
    kind: reads
    from: e.guide-overlay
    to: e.doc-data
    summary: 读取锚点坐标（elements / relations / segments）
  - id: r.win-manager-data
    kind: reads
    from: e.win-manager
    to: e.doc-data
    summary: 取对象与批注内容渲染窗口
  - id: r.seg-annot-win-manager
    kind: calls
