    to: e.viewer
    summary: 双击 HTML / 打开 bundle 进入查看与标注

  - id: r.viewer-inspector
    kind: calls
    from: e.viewer
    to: e.inspector
    summary: 装配小窗系统外壳（窗口管理器/颜色/引导线）
  - id: r.viewer-sidebar
    kind: calls
    from: e.viewer
    to: e.sidebar
