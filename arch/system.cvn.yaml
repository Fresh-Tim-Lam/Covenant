    title: 系统结构
    include:
      elements:
        - e.human
        - e.agent
        - e.cli
        - e.mcp
        - e.core
        - e.profile
        - e.validate
        - e.layout
        - e.render
        - e.patch
        - e.diff
        - e.indexer
        - e.ai
        - e.adr
        - e.editor
        - e.docs
        - e.index
        - e.audit
        - e.html
        - e.bundle
      relations: [r.*]
    layout:
      engine: elk
      direction: RIGHT
      spacing: { rank: 120, node: 44 }

  - id: v.delivery
    title: 交付与发布
    include:
