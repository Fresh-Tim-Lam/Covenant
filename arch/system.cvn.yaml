  - id: r.mcp-core
    kind: calls
    from: e.mcp
    to: e.core
    summary: 解析与类型（直接调用库，不经 CLI）
  - id: r.mcp-validate
    kind: calls
    from: e.mcp
    to: e.validate
    summary: check 工具
  - id: r.mcp-layout
    kind: calls
    from: e.mcp
    to: e.layout
    summary: render 工具布局
  - id: r.mcp-render
    kind: calls
    from: e.mcp
