annotations:
  - id: a.01JAYS3KV0001AAAA0001
    target: { kind: element, id: e.render }
    type: smell
    severity: medium
    title: 短边标签在密集图里仍会相邻
    body: lane 只错开 12px；同一跨度多条平行边时标签仍可能挤压。
    status: "resolved"
    updated: "2026-11-03T07:15:24.205Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:24.205Z"}
    author: human:team
    created: 2026-11-03T00:00:00+08:00
    ai_hint: 优化标签布局前先加一条黄金 SVG 测试，避免视觉回归。

  - id: a.01JAYS3KV0002AAAA0002
    target: { kind: element, id: e.layout }
    type: question
    severity: low
    title: 交叉最小化是否覆盖跨层边
    body: 当前只对相邻层的边做 barycenter；跨层边靠绕行规避，不参与交叉计数。
    status: "resolved"
    updated: "2026-11-03T07:15:24.205Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:24.205Z"}
    author: human:team
    created: 2026-11-03T00:00:00+08:00

  - id: a.01JAYS3KV0003AAAA0003
    target: { kind: element, id: e.html }
    type: risk
    severity: high
    title: 真实浏览器尚未验收
    body: 交互只在 jsdom 验证；CSS 布局与手感需要人工双击确认。
    status: open
    author: human:team
    created: 2026-11-03T00:00:00+08:00
    ai_hint: 不要基于未经浏览器验证的视觉结论做设计决策。
