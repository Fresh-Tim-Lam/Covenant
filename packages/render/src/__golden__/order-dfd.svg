<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="398" viewBox="0 0 1408 398" role="img" aria-labelledby="cvn-title cvn-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="cvn-title">数据流图</title>
<desc id="cvn-desc">说明订单从下单到履约的数据流动路径，并标出信任边界与数据存储归属。
</desc>
