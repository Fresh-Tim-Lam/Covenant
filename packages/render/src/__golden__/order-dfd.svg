<text x="1017.5" y="222" font-size="10.5" fill="#94a3b8">订单主表与状态</text>
</g>
<g class="node kind-data-store" data-id="e.stock-db">
<rect x="1295.5" y="162" width="190" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="1307.5" y="186" font-size="13" font-weight="650" fill="#0f172a">D2 库存库</text>
<text x="1307.5" y="222" font-size="10.5" fill="#94a3b8">SKU 可用量与预占记录</text>
</g>
