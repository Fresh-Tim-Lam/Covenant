</g>
<g class="node kind-process" data-id="e.order-svc">
<rect x="608" y="162" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="620" y="186" font-size="13" font-weight="650" fill="#0f172a">2 订单处理</text>
<text x="620" y="222" font-size="10.5" fill="#94a3b8">创建订单、计算金额、生成履约事…</text>
