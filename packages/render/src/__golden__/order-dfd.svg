<text x="310" y="14" font-size="11.5" fill="#2563eb" font-weight="600">可信区</text></g>
<g class="edge" data-id="r.merchant-gw"><path d="M218 199 L238 199 L298 199 L318 199" fill="none" stroke="transparent" stroke-width="10" pointer-events="stroke"/><path d="M218 199 L238 199 L298 199 L318 199" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#cvn-arrow)"/></g>
