<text class="edge-label" x="1109.75" y="103.97" text-anchor="middle" font-size="10.5" fill="#64748b" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">flow</text>
<text class="edge-label" x="834.58" y="217.5" text-anchor="middle" font-size="10.5" fill="#64748b" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke">bidir-flow</text>
<g class="node kind-external-entity" data-id="e.merchant">
<rect x="28" y="162" width="190" height="74" rx="8" fill="#fff7ed" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
