<text x="330" y="222" font-size="10.5" fill="#94a3b8">校验签名、限流、协议转换</text>
</g>
<g class="node kind-process" data-id="e.order-svc">
<rect x="608" y="162" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="620" y="186" font-size="13" font-weight="650" fill="#0f172a">2 订单处理</text>
<text x="620" y="222" font-size="10.5" fill="#94a3b8">创建订单、计算金额、生成履约事…</text>
</g>
<g class="node kind-process" data-id="e.stock-svc">
<rect x="899.75" y="28" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="911.75" y="52" font-size="13" font-weight="650" fill="#0f172a">3 库存校验</text>
<text x="911.75" y="88" font-size="10.5" fill="#94a3b8">校验并预占库存</text>
</g>
<g class="node kind-data-store" data-id="e.order-db">
<rect x="899.75" y="162" width="190" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="911.75" y="186" font-size="13" font-weight="650" fill="#0f172a">D1 订单库</text>
<text x="911.75" y="222" font-size="10.5" fill="#94a3b8">订单主表与状态</text>
</g>
<g class="node kind-data-store" data-id="e.stock-db">
<rect x="1189.75" y="162" width="190" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="1201.75" y="186" font-size="13" font-weight="650" fill="#0f172a">D2 库存库</text>
<text x="1201.75" y="222" font-size="10.5" fill="#94a3b8">SKU 可用量与预占记录</text>
</g>
<g class="badge"><circle cx="1367.75" cy="174" r="10" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="1367.75" y="177.6" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">1</text></g>
<g class="node kind-external-entity" data-id="e.psp">
<rect x="899.75" y="296" width="190" height="74" rx="8" fill="#fff7ed" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="911.75" y="320" font-size="13" font-weight="650" fill="#0f172a">支付通道</text>
<text x="911.75" y="356" font-size="10.5" fill="#94a3b8">第三方收单，不可信网络</text>
</g>
