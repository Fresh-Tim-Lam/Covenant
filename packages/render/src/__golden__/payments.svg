<text x="664" y="256" font-size="10.5" fill="#94a3b8">支付授权、捕获、退款编排</text>
</g>
<g class="node kind-datastore" data-id="e.ledger">
<rect x="952" y="52" width="190" height="74" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
