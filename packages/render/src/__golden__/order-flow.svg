<g class="node kind-start" data-id="e.start">
<rect x="153" y="28" width="190" height="74" rx="37" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1.5"/>
<text x="248" y="69.5" text-anchor="middle" font-size="13" font-weight="650" fill="#0f172a">收到下单请求</text>
</g>
<g class="node kind-decision" data-id="e.check-stock">
<polygon points="248,192 343,229 248,266 153,229" fill="#fffbeb" stroke="#94a3b8" stroke-width="1.5"/>
<text x="248" y="227" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">库存充足？</text>
<text x="248" y="243" text-anchor="middle" font-size="10" fill="#94a3b8">查询可售库存</text>
</g>
<g class="node kind-process" data-id="e.reserve">
<rect x="28" y="356" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="380" font-size="13" font-weight="650" fill="#0f172a">锁定库存</text>
<text x="40" y="416" font-size="10.5" fill="#94a3b8">预占库存</text>
</g>
<g class="node kind-io" data-id="e.reject">
<polygon points="296,356 468,356 450,430 278,430" fill="#f5f3ff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="308" y="382" font-size="13" font-weight="650" fill="#0f172a">返回缺货</text>
<text x="308" y="416" font-size="10.5" fill="#94a3b8">终止本次下单</text>
</g>
<g class="node kind-process" data-id="e.create">
<rect x="153" y="520" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="165" y="544" font-size="13" font-weight="650" fill="#0f172a">创建订单</text>
<text x="165" y="580" font-size="10.5" fill="#94a3b8">落订单主表</text>
</g>
<g class="node kind-process" data-id="e.pay">
<rect x="153" y="684" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="165" y="708" font-size="13" font-weight="650" fill="#0f172a">发起支付</text>
<text x="165" y="744" font-size="10.5" fill="#94a3b8">调起收银台</text>
</g>
<g class="node kind-decision" data-id="e.paid">
<polygon points="248,848 343,885 248,922 153,885" fill="#fffbeb" stroke="#94a3b8" stroke-width="1.5"/>
<text x="248" y="883" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">支付成功？</text>
<text x="248" y="899" text-anchor="middle" font-size="10" fill="#94a3b8">等待支付回调</text>
</g>
<g class="node kind-process" data-id="e.retry">
<rect x="28" y="1012" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="1036" font-size="13" font-weight="650" fill="#0f172a">进入补偿队列</text>
<text x="40" y="1072" font-size="10.5" fill="#94a3b8">异步重试/退款</text>
</g>
<g class="node kind-io" data-id="e.fail">
<polygon points="171,1176 343,1176 325,1250 153,1250" fill="#f5f3ff" stroke="#94a3b8" stroke-width="1.5"/>
