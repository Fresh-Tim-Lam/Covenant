<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="460" viewBox="0 0 1030 460" role="img" aria-labelledby="cvn-title cvn-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="cvn-title">下单支付交互</title>
<desc id="cvn-desc">说明一次支付从商户到 PSP 的同步调用链与异步回调，作为接口契约。</desc>
<defs><marker id="cvn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="1030" height="460" fill="#ffffff"/>
<g class="participant" data-id="e.merchant">
<rect x="40" y="24" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="125" y="50.5" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">商户</text>
<line x1="125" y1="68" x2="125" y2="436" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4"/>
</g>
<g class="participant" data-id="e.gateway">
<rect x="300" y="24" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="385" y="50.5" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">支付网关</text>
<line x1="385" y1="68" x2="385" y2="436" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4"/>
</g>
<g class="participant" data-id="e.orchestrator">
<rect x="560" y="24" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="645" y="50.5" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">支付编排</text>
<line x1="645" y1="68" x2="645" y2="436" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4"/>
</g>
<g class="participant" data-id="e.psp">
<rect x="820" y="24" width="170" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="905" y="50.5" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0f172a">PSP 收单</text>
<line x1="905" y1="68" x2="905" y2="436" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4"/>
</g>
<g class="message kind-sync" data-id="r.submit">
<line x1="125" y1="114" x2="385" y2="114" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#cvn-arrow)"/>
<text x="255" y="108" text-anchor="middle" font-size="10.5" fill="#64748b">1. 提交订单</text>
</g>
<g class="message kind-sync" data-id="r.create">
<line x1="385" y1="160" x2="645" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#cvn-arrow)"/>
<text x="515" y="154" text-anchor="middle" font-size="10.5" fill="#64748b">2. 创建支付</text>
</g>
<g class="message kind-sync" data-id="r.auth">
<line x1="645" y1="206" x2="905" y2="206" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#cvn-arrow)"/>
<text x="775" y="200" text-anchor="middle" font-size="10.5" fill="#64748b">3. 授权</text>
</g>
<g class="message kind-reply" data-id="r.auth-result">
<line x1="905" y1="252" x2="645" y2="252" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#cvn-arrow)"/>
<text x="775" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">4. 授权成功</text>
</g>
<g class="message kind-reply" data-id="r.create-result">
<line x1="645" y1="298" x2="385" y2="298" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#cvn-arrow)"/>
<text x="515" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">5. 支付结果</text>
</g>
<g class="message kind-reply" data-id="r.submit-result">
<line x1="385" y1="344" x2="125" y2="344" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#cvn-arrow)"/>
<text x="255" y="338" text-anchor="middle" font-size="10.5" fill="#64748b">6. 响应</text>
</g>
<g class="message kind-async" data-id="r.notify">
<line x1="905" y1="390" x2="645" y2="390" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#cvn-arrow)"/>
<text x="775" y="384" text-anchor="middle" font-size="10.5" fill="#64748b">7. 异步回调</text>
</g>
</svg>