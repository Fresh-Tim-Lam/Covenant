<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>单元素画布（剧本验证）</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#cbd5e1;--accent:#2563eb;--danger:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
header .sub{color:var(--muted);font-size:12px;white-space:nowrap}
header .sp{flex:1}
header button{font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
header button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#zoom{display:flex;align-items:center;gap:4px}
#zoom-label{min-width:42px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#shell{display:flex;flex:1;min-height:0}
#views{width:224px;flex:0 0 224px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
#views button{display:block;width:100%;text-align:left;white-space:normal;word-break:break-word;font:inherit;font-size:12.5px;line-height:1.35;padding:7px 9px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;color:var(--ink)}
#views button:hover{background:#f1f5f9}
#views button.on{background:#dbeafe;border-color:var(--accent);color:var(--accent);font-weight:600}
#views button.views-doc{padding-left:16px}
.views-group{margin:0 0 10px}
.views-group:last-child{margin-bottom:0}
.views-group-title{font-size:11px;font-weight:600;color:#94a3b8;padding:3px 9px 5px;letter-spacing:.03em;user-select:none;-webkit-user-select:none}
.views-group.on>.views-group-title{color:var(--accent)}
body.nav-collapsed #views{display:none}
main{position:relative;flex:1;min-height:0;overflow:hidden}
#stage-wrap{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#stage-wrap.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.doc svg{display:block;background:#fff;border:1px solid var(--line);border-radius:10px}
#tip{position:absolute;left:12px;bottom:10px;z-index:5;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted);pointer-events:none}
#inspector{position:absolute;left:16px;top:16px;z-index:20;width:360px;max-width:calc(100vw - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px rgba(15,23,42,.2)}
#inspector[hidden]{display:none}
.insp-head{display:flex;align-items:center;gap:6px;flex:0 0 38px;height:38px;padding:0 10px;background:linear-gradient(#f8fafc,#f1f5f9);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;cursor:grab;user-select:none;-webkit-user-select:none}
.insp-body{flex:1;min-height:0;overflow:auto;padding:10px 14px 14px}
.insp-head:active{cursor:grabbing}
.insp-head .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569}
.grip{width:14px;height:16px;flex:0 0 14px;background-image:radial-gradient(#94a3b8 1px,transparent 1.3px);background-size:5px 5px;opacity:.75}
.insp-head .insp-actions{margin-left:auto}
.insp-close{border:0;background:transparent;font-size:17px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px}
.insp-close:hover{color:var(--ink)}
.pin-btn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:13px;line-height:1;padding:2px 7px;cursor:pointer;opacity:.55;filter:grayscale(1);transition:all .12s}
.pin-btn:hover{opacity:.85;filter:grayscale(.4)}
.pin-btn.on{background:#dbeafe;border-color:var(--accent);opacity:1;filter:none;transform:rotate(-30deg);box-shadow:0 0 0 2px #bfdbfe}
.pin-btn.on::after{content:"●";font-size:7px;color:var(--accent);margin-left:2px}
.del-ann{float:right;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;line-height:1;padding:2px 6px;cursor:pointer;color:#b91c1c}
.del-ann:hover{background:#fee2e2}
.edit-ann{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;margin-right:6px}
.anns li.editing{background:#eff6ff;border-color:#bfdbfe}
.edit-form{border-color:#bfdbfe;background:#f8fafc}
.edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:1;background:#f8fafc;padding:2px 0 4px}
.edit-head h3{margin:0}
.edit-actions{display:flex;gap:6px;align-items:center}
.edit-head .ann-save{font-size:12px;padding:3px 12px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
.edit-head .ann-save:hover{background:#1d4ed8}
.edit-head .ann-cancel{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:#475569}
.edit-head .ann-cancel:hover{background:#f1f5f9}
.trash{margin-top:10px;border:1px dashed var(--line);border-radius:8px;background:#fafafa}
.trash summary{cursor:pointer;padding:6px 10px;font-size:12px;color:#64748b;user-select:none;list-style:none}
.trash summary::before{content:"▸ ";font-size:10px}
.trash[open] summary::before{content:"▾ "}
.trash summary:hover{color:#334155;background:#f1f5f9;border-radius:6px}
.trash .anns{padding:0 10px 8px}
.trash .anns li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.trash-restore{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
#toast.undoable{pointer-events:auto;display:flex;gap:10px;align-items:center}
#toast button{border:1px solid #93c5fd;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
h3{font-size:13px;margin:0 0 8px}
.hint{color:var(--muted);font-size:12px}
.meta{color:var(--muted);font-size:12px;margin-bottom:10px}
.kv{font-size:12.5px;margin:2px 0}
.kv b{color:var(--muted);font-weight:500;display:inline-block;min-width:52px}
ul.anns{list-style:none;margin:10px 0 0;padding:0}
ul.anns li{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.chip{display:inline-block;padding:1px 6px;border-radius:999px;font-size:11px;color:#fff;margin-right:4px}
.chip.low{background:#94a3b8}.chip.medium{background:#d97706}.chip.high{background:var(--danger)}.chip.blocker{background:#7f1d1d}
.chip.type{background:#e2e8f0;color:#334155}
.ann-title{font-weight:600;font-size:12.5px;margin:3px 0}
.ann-body{font-size:12px;color:#334155;white-space:pre-wrap}
.ann-hint{margin-top:6px;padding:6px 8px;border-left:3px solid var(--accent);background:#dbeafe;font-size:12px;border-radius:0 4px 4px 0;white-space:pre-wrap}
.form{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.form label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.form input,.form textarea,.form select{width:100%;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.form textarea{resize:vertical;min-height:52px}
.form .row{display:flex;gap:8px}
.form .row>div{flex:1}
.form button{margin-top:10px;width:100%;font:inherit;font-size:13px;padding:8px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
footer{flex:0 0 auto;padding:5px 14px;border-top:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11.5px;display:flex;gap:16px}
.node,.edge{cursor:pointer}
.node:hover rect,.node:hover polygon,.node:hover ellipse{stroke:var(--accent);stroke-width:2.5}
.node.sel rect,.node.sel polygon,.node.sel ellipse{stroke:var(--accent);stroke-width:2.5}
.edge:hover path{stroke:var(--accent)}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.acts button{font:inherit;font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
#stage-wrap,header,#views,footer,#tip{user-select:none;-webkit-user-select:none}
svg text{user-select:none}
.editing .node{cursor:move}
#inspector,#inspector input,#inspector textarea,#inspector select{user-select:text}
.insp-actions{display:flex;gap:6px;align-items:center}
.copy-btn{font:inherit;font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--ink)}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.verify-top-btn{font:inherit;font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:#16a34a;font-weight:600}
.verify-top-btn.on{background:#16a34a;border-color:#16a34a;color:#fff}
.verify-top-btn:not(.on){opacity:.55}
.verify-top-btn:not(.on):hover{opacity:1;border-color:#16a34a}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:#0f172a;color:#fff;padding:7px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.edit-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.edit-box label{display:block;font-size:12px;color:var(--muted);margin:7px 0 3px}
.edit-box input,.edit-box textarea{width:100%;font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.edit-box textarea{min-height:46px;resize:vertical}
.edit-box .row{display:flex;gap:8px}
.edit-box .row>div{flex:1}
.edit-box button{margin-top:9px;width:100%;font:inherit;font-size:12.5px;padding:7px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
/* —— 多小窗 / 同色引导线 / 彩色锚点高亮 / 折叠表单 —— */
.cvn-win{position:absolute;left:16px;top:16px;z-index:20;width:360px;max-width:calc(100vw - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:0 14px 36px rgba(15,23,42,.2)}
.cvn-win[hidden]{display:none}
.cvn-win,.cvn-win input,.cvn-win textarea,.cvn-win select{user-select:text}
.cvn-win .insp-head{border-bottom-width:2px;border-bottom-style:solid}
.win-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(15,23,42,.12)}
#insp-guides{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:15}
#insp-guides[hidden]{display:none}
#insp-guides line{stroke-width:1.5;stroke-dasharray:5 4;stroke-opacity:.85}
.node.hl rect,.node.hl polygon,.node.hl ellipse,.edge.hl path{stroke:var(--hl)!important;stroke-width:2.5!important}
.ann-form{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.ann-form-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ann-form-toggle{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;padding:4px 0;border:0;background:transparent;color:#334155;cursor:pointer;text-align:left;flex:1}
.ann-form-toggle:hover{border-color:var(--accent);color:var(--accent)}
.ann-form-chev{font-size:11px;color:var(--muted);width:10px;display:inline-block}
.ann-form-actions{display:flex;gap:6px;align-items:center}
.f-submit-btn{font:inherit;font-size:12px;font-weight:600;padding:3px 12px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;white-space:nowrap}
.f-submit-btn:hover{background:#1d4ed8}
.f-cancel-btn{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:#64748b;white-space:nowrap}
.f-cancel-btn:hover{background:#f1f5f9}
.ann-form-body{margin-top:8px}
.ann-form-body[hidden]{display:none}
/* 运行时多段热区：永远透明、不吃 hover/彩色高亮的路径样式，只负责命中 */
.edge path.seg-hit{stroke:transparent!important;stroke-width:10px!important;stroke-opacity:1!important}
.whole-edge-box{margin-top:10px;border:1px dashed var(--line);border-radius:8px;padding:8px;background:#fafafa}
.whole-edge-box>button{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:#334155}
.whole-edge-box>button:hover{border-color:var(--accent);color:var(--accent)}
.whole-edge-body{margin-top:8px}
.whole-edge-body[hidden]{display:none}
.whole-edge-actions{margin-top:6px}
/* 实现状态 chip（implemented 灰 / partial 蓝 / planned 琥珀 / not_connected 灰 / unknown 琥珀） */
.impl-chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;line-height:1.6;border:1px solid transparent;font-weight:600}
.impl-implemented{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.impl-partial{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.impl-planned{background:#fef3c7;color:#b45309;border-color:#fde68a}
.impl-not_connected{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0}
.impl-unknown{background:#fffbeb;color:#b45309;border-color:#fde68a}
.impl-note{font-size:11px;color:var(--muted);margin-left:4px}
/* 结构化证据列表（不画进 SVG） */
.evidence{list-style:none;margin:8px 0 0;padding:0}
.evidence li{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed #eef2f7}
.evidence li:last-child{border-bottom:0}
.ev-kind{flex:0 0 auto;font-size:10px;padding:0 5px;border-radius:4px;background:#e2e8f0;color:#475569}
.ev-kind.ev-code{background:#e0f2fe;color:#0369a1}
.ev-kind.ev-doc{background:#ede9fe;color:#6d28d9}
.ev-path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#334155}
.copy-evidence{flex:0 0 auto;font:inherit;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;color:#475569}
.copy-evidence:hover{border-color:var(--accent);color:var(--accent)}
/* —— 图上增删元素（script-edit-elements.ts）：待新增虚线占位 / 待删除降饱和 / 创建表单 —— */
.pending-add{pointer-events:none}
.pending-add rect{fill:#f8fafc;stroke:#2563eb;stroke-dasharray:5 4}
.pending-add text{fill:#2563eb;font-size:12px}
.node.pending-remove,.edge.pending-remove{opacity:.42;filter:grayscale(1)}
.node.pending-remove text{opacity:.55;text-decoration:line-through}
#elem-pending{color:#b45309}
.pending-add-rel{pointer-events:none}
.edge.pending-remove-rel{opacity:.42;filter:grayscale(1)}
body.connecting,body.connecting .node{cursor:crosshair}
body.editing,body.editing .node,body.editing .edge{cursor:crosshair}
body:not(.editing) .connect-top-btn{display:none}
.cvn-create-win .insp-head,.relform-win .insp-head{cursor:grab}
#rel-pending{color:#b45309}
.connect-top-btn{font:inherit;font-size:12px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#334155;cursor:pointer}
.connect-top-btn:hover{border-color:var(--accent);color:var(--accent)}
.cvn-create-win{width:340px}
.ce-form{margin-top:0;border-top:0;padding-top:0}
.cvn-create-actions{display:flex;gap:8px;margin-top:12px}
.cvn-create-actions button{flex:1;width:auto;margin-top:0;font:inherit;font-size:13px;padding:7px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
.cvn-create-actions #ce-cancel{background:#fff;color:#334155;border-color:var(--line)}
</style>
</head>
<body>
<header>
<h1>单元素画布（剧本验证）</h1>
<span class="sub">1 张契约图 · 0 条已入库批注 · 构建期渲染 · 无外部请求</span>
<span class="sp"></span>
<button id="btn-nav" title="收起/展开侧栏">☰</button>
<div id="zoom">
<button id="zoom-out" title="缩小">−</button>
<span id="zoom-label">100%</span>
<button id="zoom-in" title="放大">+</button>
<button id="zoom-fit" title="适应窗口">适应</button>
<button id="zoom-reset" title="100%">1:1</button>
</div>
<span class="sub" id="edit-pending" hidden>暂存修改 0</span>
<button id="btn-edit" title="编辑文本属性与节点位置">编辑</button>
<button id="btn-edit-export" hidden title="导出 edits.json，用 covenant edit 应用">导出编辑 JSON</button>
<button id="btn-edit-save" hidden title="通过本地编辑服务预览 diff 并写回">预览并写回</button>
<span class="sub" id="pending">未导出批注 0</span>
<button id="btn-reset">重置本地改动</button>
<button id="btn-export" class="pri">导出补丁 JSON</button>
<button id="btn-export-all" title="把所有文档的改动打包成一个 covenant-all.patches.json">导出全部 JSON</button>
<button id="btn-ann-save" class="pri" hidden title="把批注改动直接写回 .cvn.yaml（需 pnpm edit:serve）">写回</button>
</header>
<div id="shell">
<aside id="views">
      <input id="views-search" type="text" placeholder="搜索架构图…" style="width:100%;padding:5px 8px;margin-bottom:6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;color:var(--ink2);background:var(--surface);outline:none">
      <div class="views-group on" data-group="其他"><div class="views-group-title">其他</div>
        <button class="views-doc" data-doc="e2e/single#v.main">单元素画布（剧本验证） · 总览</button>
      </div>
</aside>
<main>
<div id="stage-wrap"><div id="stage">
<section class="doc" data-doc="e2e/single#v.main">
<svg xmlns="http://www.w3.org/2000/svg" width="246" height="130" viewBox="0 0 246 130" role="img" aria-labelledby="cvn-title cvn-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="cvn-title">总览</title>
<desc id="cvn-desc">交互剧本隔离验证——只有唯一元素，排除多元素干扰</desc>
<defs><marker id="cvn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="0" y="0" width="246" height="130" fill="#ffffff"/>
<g class="node kind-container" data-id="e.only">
<rect x="28" y="28" width="190" height="74" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="52" font-size="13" font-weight="650" fill="#0f172a">唯一元素</text>
<text x="40" y="70" font-size="11" fill="#64748b">e2e</text>
<text x="40" y="88" font-size="10.5" fill="#94a3b8">剧本验证用容器</text>
</g>
</svg>
</section>
</div></div>
<div id="tip">滚轮缩放 · 拖拽平移 · 双击放大 · 悬停预览 · 点击元素/连线标注</div>
<svg id="insp-guides" aria-hidden="true" hidden></svg>
<div id="inspector" hidden class="cvn-win"></div>
</main>

  function restoreAnn(id){

    l.deleted = l.deleted.filter(function(x){ return x !== id; });
    save(); refreshDocUi(); renderSelected();
    pushUndo(function(){ localFor(doc.docId).deleted.push(id); save(); refreshDocUi(); renderSelected(); });

  function undoLast(){

  function showUndoToast(msg, label){

    tip.innerHTML = '<span>' + esc(msg) + '</span><button id="toast-undo">' + esc(label) + '</button>';
    tip.className = "show undoable";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ tip.className = ""; tip.textContent = ""; }, 3200);

    if (ub) ub.addEventListener("click", function(ev){ ev.stopPropagation(); tip.className = ""; undoLast(); });

  function bindWin(w){
    var el = w.el;
    var kind = w.kind, id = w.targetId;
    var head = el.querySelector(".insp-head");
    var closeBtn = el.querySelector(".insp-close");
    if (closeBtn) closeBtn.addEventListener("click", function(ev){ ev.stopPropagation(); closeWin(w); });
    var copyBtn = el.querySelector(".copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", function(ev){ ev.stopPropagation(); copySelection(kind, id, w.segment); });
    // 证据路径复制（复用 fallbackCopy；不做 file:// 跳转）
    var evBtns = el.querySelectorAll(".copy-evidence");
    for (var evi = 0; evi < evBtns.length; evi++){
      (function(btn){
        btn.addEventListener("click", function(ev){
          ev.stopPropagation();
          var text = btn.getAttribute("data-copy") || "";
          fallbackCopy(text, function(ok){ showToast(ok ? "已复制路径" : "复制失败：请手动选择路径"); });
        });
      })(evBtns[evi]);
    }
    var pinBtn = el.querySelector(".pin-btn");
    if (pinBtn) {
      function paintPin(){
        pinBtn.className = w.pinned ? "pin-btn on" : "pin-btn";
        pinBtn.setAttribute("aria-pressed", w.pinned ? "true" : "false");
        pinBtn.title = w.pinned ? "已钉住：点击别处也不关闭（再点取消）" : "钉住：点击别处不关闭";
      }
      paintPin();
      pinBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        w.pinned = !w.pinned;
        if (w.pinned){ w.state = "clicked"; clearTimeout(w.closeTimer); }
        paintPin();
        showToast(w.pinned ? "已钉住：点击别处不关闭" : "已取消钉住：点击别处会关闭");
      });
    }
    var toggle = el.querySelector(".ann-form-toggle");
    if (toggle) toggle.addEventListener("click", function(ev){
      ev.stopPropagation();
      w.formOpen = !w.formOpen;
      var body = el.querySelector(".ann-form-body");
      if (body) body.hidden = !w.formOpen;
      var actions = el.querySelector(".ann-form-actions");
      if (actions) actions.hidden = !w.formOpen;
      toggle.setAttribute("aria-expanded", w.formOpen ? "true" : "false");
      var chev = toggle.querySelector(".ann-form-chev");
      if (chev) chev.textContent = w.formOpen ? "▾" : "▸";
      updateGuides();
    });
    var cancelBtn = el.querySelector(".f-cancel-btn");
    if (cancelBtn) cancelBtn.addEventListener("click", function(ev){
      ev.stopPropagation();
      w.formOpen = false;
      var body = el.querySelector(".ann-form-body");
      if (body) body.hidden = true;
      var actions = el.querySelector(".ann-form-actions");
      if (actions) actions.hidden = true;
      var tg = el.querySelector(".ann-form-toggle");
      if (tg) { tg.setAttribute("aria-expanded", "false"); var ch = tg.querySelector(".ann-form-chev"); if (ch) ch.textContent = "▸"; }
    });
    if (head) {
      head.addEventListener("pointerdown", function(ev){
        if (!ev.target || !ev.target.closest || ev.target.closest("button")) return;
        ev.preventDefault();
        // 必须阻止冒泡：否则 pointerdown 会传到画布 → 触发画布平移/点击清除选择
        ev.stopPropagation();
        if (ev.button !== 0) return;
        activateWin(w);
        draggingWin = true;
        var parent = el.offsetParent || document.body;
        var px = function(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; };
        var drag = {
          sx: ev.clientX,
          sy: ev.clientY,
          l: px(el.style.left) || el.offsetLeft,
          t: px(el.style.top) || el.offsetTop,
          moved: false,
        };
        function move(e2){
          var dx = e2.clientX - drag.sx, dy = e2.clientY - drag.sy;
          if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
          if (!drag.moved) return;
          // 允许拖出容器边界（不钳制），用户可通过滚动/缩放找回窗口
          el.style.left = (drag.l + dx) + "px";
          el.style.top = (drag.t + dy) + "px";
          updateGuides();
        }
        function up(){ draggingWin = false; pointerSuppressedUntil = Date.now() + SUPPRESS_AFTER_DRAG_MS; window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); }
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });
    }
    // 窗口根元素的 pointerdown/enter/leave 由 ensureWinElListeners 一次性安装（见上），
    // 这里只按当前窗口状态刷新内容；不要再往 el 上绑监听（会累积旧闭包 → 幽灵窗）。
    // 段窗：折叠"整条边批注" + 打开整条边窗口
    var wholeToggle = el.querySelector(".whole-edge-toggle");
    if (wholeToggle) wholeToggle.addEventListener("click", function(ev){
      ev.stopPropagation();
      var body = el.querySelector(".whole-edge-body");
      var open = body ? body.hidden : false;
      if (body) body.hidden = !open;
      wholeToggle.setAttribute("aria-expanded", open ? "true" : "false");
      updateGuides();
    });
    var openEdgeBtn = el.querySelector(".open-edge-win");
    if (openEdgeBtn) openEdgeBtn.addEventListener("click", function(ev){
      ev.stopPropagation();
      openWindow("relation", id, "clicked", { x: ev.clientX, y: ev.clientY }, null);
    });
    // 新建批注的标注范围（本段 / 整条边）
    var scopeSel = fieldOf(w, "f-scope");
    if (scopeSel) scopeSel.addEventListener("change", function(){ w.formScope = String(scopeSel.value); });
    var editBtns = el.querySelectorAll(".edit-ann");
    for (var ei = 0; ei < editBtns.length; ei++){
      (function(btn){ btn.addEventListener("click", function(ev){ ev.stopPropagation(); editingAnn = btn.getAttribute("data-id"); w.formOpen = false; renderWin(w); }); })(editBtns[ei]);
    }
    var saveBtns = el.querySelectorAll(".ann-save");
    for (var si2 = 0; si2 < saveBtns.length; si2++){
      (function(btn){ btn.addEventListener("click", function(ev){ ev.stopPropagation(); saveAnnEdit(btn.getAttribute("data-id"), w); }); })(saveBtns[si2]);
    }
    var cancelBtns = el.querySelectorAll(".ann-cancel");
    for (var ci = 0; ci < cancelBtns.length; ci++){
      (function(btn){ btn.addEventListener("click", function(ev){ ev.stopPropagation(); editingAnn = null; renderWin(w); }); })(cancelBtns[ci]);
    }
    var delBtns = el.querySelectorAll(".del-ann");
    for (var di = 0; di < delBtns.length; di++){
      (function(btn){ btn.addEventListener("click", function(ev){ ev.stopPropagation(); deleteAnn(btn.getAttribute("data-id")); }); })(delBtns[di]);
    }
    var resBtns = el.querySelectorAll(".trash-restore");
    for (var ri = 0; ri < resBtns.length; ri++){
      (function(btn){ btn.addEventListener("click", function(ev){ ev.stopPropagation(); restoreAnn(btn.getAttribute("data-id")); }); })(resBtns[ri]);
    }
    if (editing) {
      var applyBtn = fieldOf(w, "edit-apply");
      if (applyBtn) applyBtn.addEventListener("click", function(){ applyEditUi(kind, id, w); });
    }
    // ✓ 核验按钮（顶栏紧凑样式：只切 on 类，文字保持 "✓"）
    var verifyBtns = el.querySelectorAll(".verify-top-btn");
    for (var vi = 0; vi < verifyBtns.length; vi++){
      (function(vb){
        vb.addEventListener("click", function(ev){
          ev.stopPropagation();
          // 注意：bindWin 作用域里没有 doc 变量。此前这里写 doc.docId，
          // 点击瞬间抛 ReferenceError 并被浏览器吞掉 → 按钮"点了没反应"。
          var vdoc = currentDoc();
          if (!vdoc) return;
          var vid = vb.getAttribute("data-id");
          if (!vid) return;
          var ll = localFor(vdoc.docId);
          if (ll.checked[vid]) { delete ll.checked[vid]; } else { ll.checked[vid] = true; }
          save();
          vb.classList.toggle("on", !!ll.checked[vid]);
          vb.textContent = "✓";
          refreshCheckedBadges(vdoc);
        });
      })(verifyBtns[vi]);

  function buildPatchFor(doc){
    if (!doc) return null;
    var l = localFor(doc.docId);
    var ops = [];
    for (var i=0;i<l.add.length;i++){
      var a = effAnn(doc, l.add[i]);
      ops.push({ op: "add", path: "/annotations/-", value: {
        id: a.id, target: a.target, type: a.type, severity: a.severity,
        title: a.title, body: a.body, status: a.status, author: a.author,
        created: a.created, ai_hint: a.aiHint || undefined
      }});
    }
    for (var id2 in l.status){
      if (!Object.prototype.hasOwnProperty.call(l.status, id2)) continue;
      if (l.deleted.indexOf(id2) >= 0) continue;
      ops.push({ op: "replace", path: "/annotations/" + id2 + "/status", value: l.status[id2] });
    }
    for (var eid in l.edited){
    if (!Object.prototype.hasOwnProperty.call(l.edited, eid)) continue;
    if (l.deleted.indexOf(eid) >= 0) continue;
    var isLocalAdd = false;
    for (var ai = 0; ai < l.add.length; ai++) if (l.add[ai].id === eid) isLocalAdd = true;
    if (isLocalAdd) continue;
    var orig = byId(doc.annotations, eid);
    if (!orig) continue;
    var merge = effAnn(doc, orig);
    ops.push({ op: "replace", path: "/annotations/" + eid, value: {
      id: merge.id, target: merge.target, type: merge.type, severity: merge.severity,
      title: merge.title, body: merge.body, status: effStatus(doc, merge), author: merge.author,
      created: merge.created, ai_hint: merge.aiHint || undefined
    }});
  }
  for (var d2 = 0; d2 < l.deleted.length; d2++){
      ops.push({ op: "remove", path: "/annotations/" + l.deleted[d2], value: null });
    }
    var pushed = pushPendingElementOps(doc, ops) + pushPendingRelationOps(doc, ops);
    if (!ops.length && !pushed) return null;
    for (var cid in l.checked) {
      if (!Object.prototype.hasOwnProperty.call(l.checked, cid) || isPendingElementRemove(doc, cid)) continue;
      var cel = byId(doc.elements, cid);
      if (!cel) continue;
      var newProps = Object.assign({}, cel.props || {}, { user_verified: true });
      ops.push({ op: "replace", path: "/elements/" + cid, value: Object.assign({}, cel, { props: newProps }) });
    }
    var patch = { covenant: "0.1", doc: doc.docId, base_rev: doc.rev, intent: "人工审查（HTML 导出：批注 / 状态流转 / 元素核验 / 元素增删）", ops: ops };
    return patch;
  }

  /**
   * 写回：先取服务端真实 rev 并 rebase，再 POST。
   * 为什么必须 rebase：页面里的 doc.rev 是构建时冻结的；服务端每次写回 rev+1，
   * 若不 rebase，第二次写回必然被 gate 以 patch/base-rev 拒绝。
   */
  function serverSaveAnnotations(){
    var patch = buildAnnotationPatch();
    if (!patch) { showToast("没有改动可写回"); return; }
    var cfg = window.__CVN_EDIT__;
    if (!cfg || !cfg.patchEndpoint) { showToast("请用 pnpm edit:serve 打开页面后再写回"); return; }
    var docId = patch.doc;
    var headers = { "content-type": "application/json", "x-covenant-token": cfg.token };
    var revUrl = "/api/rev?doc=" + encodeURIComponent(docId);

    function post(){
      return fetch(cfg.patchEndpoint, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ patch: patch, actor: "human:you" }),
      }).then(function(r){
        return r.json().then(function(j){ return { status: r.status, body: j }; });
      });
    }

    fetch(revUrl, { headers: headers })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(revBody){
        // 取不到就按原 rev 试（旧 serve 无 /api/rev 时保持兼容）
        if (revBody && revBody.ok && typeof revBody.rev === "number") {
          if (revBody.rev !== patch.base_rev) {
            patch.base_rev = revBody.rev;  // rebase
            var d0 = docByAny(docId);
            if (d0) d0.rev = revBody.rev;  // 同步本地，供后续导出
          }
        }
        return post();
      })
      .then(function(x){
        if (!x.body || !x.body.ok) {
          var msg = (x.body && x.body.message) ? x.body.message : "写回失败";
          var codes = [];
          if (x.body && x.body.findings) for (var i = 0; i < x.body.findings.length; i++) codes.push(x.body.findings[i].code);
          showToast(msg + (codes.length ? "：" + codes.join(", ") : ""));
          return;
        }
        // 成功后把新 rev 写回内存中的 doc，下一次写回/导出才不会用旧 rev
        var d = docByAny(docId);
        if (d && typeof x.body.rev === "number") d.rev = x.body.rev;
        if (d) {
          delete local[docId]; save();
          drawBadges(d); updateHeader();
          renderSelected();
        }
        showToast("已写回 .cvn.yaml（rev " + x.body.rev + "）");
      })
      .catch(function(){ showToast("写回请求失败：请确认 edit:serve 仍在运行"); });
  }

  function pendingElementOps(doc){

  }

  // —— 暂存删除（只对 kind=element；被引用时拦住）——
  function deleteBlockReason(doc, id){
    var anns = visibleAnns(doc);
    var n = 0;
    for (var i = 0; i < anns.length; i++){
      var t = anns[i].target || {};
      if (t.kind === "element" && t.id === id) n++;

    if (n) return "该元素被 " + n + " 条批注引用，先处理批注再删除";
    var rels = (doc && doc.relations) || [];
    var m = 0, first = "";
    var relRemoved = relEditStateFor(doc).removes;
    for (var j = 0; j < rels.length; j++){
      if (relRemoved.indexOf(String(rels[j].id)) >= 0) continue;
      var from = String(rels[j].from || "").split(":")[0];
      var to = String(rels[j].to || "").split(":")[0];
      if (from === id || to === id) { m++; if (!first) first = String(rels[j].id || ""); }
    }
    if (m) return "该元素被 " + m + " 条关系引用（如 " + first + "），先删除关系再删除元素";
    var frames = (doc && doc.frames) || [];
    for (var k = 0; k < frames.length; k++){
      var members = frames[k].members || [];
      if (members.indexOf(id) >= 0) return "该元素是框 " + String(frames[k].id || "") + " 的成员，先移出框再删除";

    if (!elemPlacePts[docId]) elemPlacePts[docId] = {};
    elemPlacePts[docId][id] = pt;
  }
  function forgetPlacePt(docId, id){
    if (elemPlacePts[docId]) delete elemPlacePts[docId][id];
  }
  /** 客户端坐标 → SVG 用户坐标（getScreenCTM 逆变换；jsdom 无该 API 时退回原始值） */
  function clientToSvg(svg, cx, cy){
    try {
      if (!svg.getScreenCTM) return [cx, cy];
      var m = svg.getScreenCTM();
      if (!m) return [cx, cy];
      var inv = m.inverse();
      var pt = svg.createSVGPoint ? svg.createSVGPoint() : null;
      if (!pt) return [cx, cy];
      pt.x = cx; pt.y = cy;
      var p = pt.matrixTransform(inv);
      return [p.x, p.y];
    } catch (e4) { return [cx, cy]; }
  }
  function elementKindOptions(){
    var doc = currentDoc();
    var els = (doc && doc.elements) || [];
    var seen = {}, out = [];
    for (var i = 0; i < els.length; i++){
      var k = String(els[i].kind || "");
      if (!k || seen[k]) continue;
      seen[k] = 1; out.push(k);
    }
    out.sort();
    return out.length ? out : ["container"];
  }
  function templateForKind(doc, kind){
    var els = (doc && doc.elements) || [];
    for (var i = 0; i < els.length; i++) if (els[i].kind === kind) return els[i];
    return null;
  }
  /** 暂存元素的占位落点（运行时视觉；id 在 submitCreateElement 生成后回填） */
  var pendingPlacePt = null;
  function placePtPending(doc, pt){
    pendingPlacePt = { docId: doc.docId, pt: pt };
  }
  ensureElemToolbar();


  // ===== 图上增删关系（script-edit-relations.ts 注入）=====
  var relEditOps = {};
  function relEditStateFor(doc){
    if (!doc) return { adds: [], removes: [] };
    if (!relEditOps[doc.docId]) relEditOps[doc.docId] = { adds: [], removes: [] };
    return relEditOps[doc.docId];
  }
  function currentRelEditState(){ return relEditStateFor(currentDoc()); }

  // —— 顶栏待办计数（动态插入到 #elem-pending 旁，不占 html.ts 冻结行数）——
  function ensureRelPendingEl(){
    var el = document.getElementById("rel-pending");
    if (el) return el;
    el = document.createElement("span");
    el.id = "rel-pending";
    el.className = "sub";
    el.hidden = true;
    var anchor = document.getElementById("elem-pending");
    var parent = anchor && anchor.parentNode ? anchor.parentNode : document.querySelector("header");
    if (parent) parent.insertBefore(el, anchor ? anchor.nextSibling : null);
    return el;
  }
  function updateRelPending(){
    var el = ensureRelPendingEl();
    if (!el) return;
    var st = currentRelEditState();
    var n = st.adds.length + st.removes.length;
    el.textContent = "关系暂存 " + n;
    el.hidden = n === 0;
  }

  // —— 视觉：暂存新关系 = 虚线直线 overlay；待删关系 = 边降饱和 ——
  function refreshPendingRelVisuals(){
    var svg = currentSvg();
    if (!svg) return;
    var old = svg.querySelectorAll(".pending-add-rel");
    for (var r = 0; r < old.length; r++) if (old[r].parentNode) old[r].parentNode.removeChild(old[r]);
    var marked = svg.querySelectorAll(".pending-remove-rel");
    for (var m = 0; m < marked.length; m++) marked[m].classList.remove("pending-remove-rel");
    var st = currentRelEditState();
    var doc = currentDoc();
    var placed = []; // 已排布 pending 线的中段通道坐标（相互错开）
    for (var i = 0; i < st.adds.length; i++){
      var a = st.adds[i];
      var ga = svg.querySelector('.node[data-id="' + a.from + '"]');
      var gb = svg.querySelector('.node[data-id="' + a.to + '"]');
      if (!ga || !gb) continue;
      // 线路路由底层（layout 同源管线）：端口空位选点（对称 PORT_GAP 排布避让已有锚点）
      // → routePorts 端口 stub 引出 → 车道错开已有通道 → clearPath 避开无关框
      var ba = nodeRouteBox(ga, doc, a.from), bb = nodeRouteBox(gb, doc, a.to);
      if (!ba || !bb) continue;
      var pts = planPendingRoute(ba, bb, a.from, a.to, doc, svg, st.removes, placed);
      placed.push(pts[1][0]);
      var ln = document.createElementNS(SVGNS, "path");
      ln.setAttribute("class", "pending-add-rel");
      ln.setAttribute("data-id", a.id);
      ln.setAttribute("d", pts.map(function(p, k){ return (k === 0 ? "M" : "L") + p.x + " " + p.y; }).join(" "));
      ln.setAttribute("stroke", "#2563eb");
      ln.setAttribute("stroke-width", "2");
      ln.setAttribute("fill", "none");
      ln.setAttribute("stroke-dasharray", "6 4");
      ln.setAttribute("marker-end", "url(#cvn-arrow)");
      ln.setAttribute("pointer-events", "none");
      var tip = document.createElementNS(SVGNS, "title");
      tip.textContent = "待新增关系 " + a.kind + "：" + a.summary;
      ln.appendChild(tip);
      svg.appendChild(ln);
    }
    for (var j = 0; j < st.removes.length; j++){
      var edge = svg.querySelector('.edge[data-id="' + st.removes[j] + '"]');
      if (edge) edge.classList.add("pending-remove-rel");
    }
  }
  function refreshRelPendingUi(){ updateRelPending(); refreshPendingRelVisuals(); }

  // —— patch 通道：buildPatchFor 经 pushPendingRelationOps 追加 ——
  function pendingRelationOps(doc){
    var st = relEditStateFor(doc);
    var out = [];
    for (var i = 0; i < st.adds.length; i++){
      var a = st.adds[i];
      out.push({ op: "add", path: "/relations/-", value: { id: a.id, kind: a.kind, from: a.from, to: a.to, summary: a.summary } });
    }
    for (var j = 0; j < st.removes.length; j++) out.push({ op: "remove", path: "/relations/" + st.removes[j], value: null });
    return out;
  }
  function pushPendingRelationOps(doc, ops){
    var list = pendingRelationOps(doc);
    for (var i = 0; i < list.length; i++) ops.push(list[i]);
    return list.length;
  }

  /** newId() 产出 a.<大写 Crockford>；关系 id 需匹配 schema ^r\.[a-z][a-z0-9-]{0,62}$ */
  function newRelationId(){
    var raw = String(newId()).slice(2).toLowerCase().replace(/[^a-z0-9-]/g, "z");
    if (!/^[a-z]/.test(raw)) raw = "r" + raw;
    return "r." + raw;
  }

  // —— 连线模式 ——
  var connectingFrom = null;
  function startConnecting(fromId){
    var doc = currentDoc();
    if (!doc) return;
    var why = elementUsableForConnect(doc, fromId);
    if (why) { showToast(why); return; }
    connectingFrom = fromId;
    document.body.classList.add("connecting");
    showToast("连线模式：点击目标元素（Esc 或点空白取消）");
  }
  function cancelConnecting(){
    if (!connectingFrom) return;
    connectingFrom = null;
    document.body.classList.remove("connecting");
  }
  /** 元素是否可用于连线：已存在、未暂存删除、未暂存新增 */
  function elementUsableForConnect(doc, id){
    if (isPendingElementRemove(doc, id)) return "该元素已暂存删除，先撤销删除再连线";
    var st = elemEditStateFor(doc);
    for (var i = 0; i < st.adds.length; i++) if (st.adds[i].id === id) return "该元素尚未写回（暂存新增），先写回再连线";
    if (!byId((doc && doc.elements) || [], id)) return "元素不存在：" + id;
    return "";
  }
  function completeConnecting(ev){
    var doc = currentDoc();
    var fromId = connectingFrom;
    var t = ev.target && ev.target.closest ? ev.target.closest(".node") : null;
    var toId = t ? t.getAttribute("data-id") : "";
    if (!fromId){ return; }
    if (!toId){ cancelConnecting(); showToast("已取消连线"); return; }
    if (toId === fromId){ showToast("起点与终点不能是同一个元素"); return; }
    var why1 = elementUsableForConnect(doc, fromId);
    if (why1){ showToast(why1); cancelConnecting(); return; }
    var why2 = elementUsableForConnect(doc, toId);
    if (why2){ showToast(why2); cancelConnecting(); return; }
    connectingFrom = null;
    document.body.classList.remove("connecting");
    openRelationForm({ from: fromId, to: toId }, ev);
  }

  // —— 关系表单（复用 .cvn-win 外壳）——
  function relationKindOptions(doc){
    var rels = (doc && doc.relations) || [];
    var seen = {}, out = [];
    for (var i = 0; i < rels.length; i++){
      var k = String(rels[i].kind || "");
      if (!k || seen[k]) continue;
      seen[k] = 1; out.push(k);
    }
    out.sort();
    return out.length ? out : ["calls"];
  }
  function closeRelationForm(){
    var el = document.getElementById("relform-win");
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }
  function openRelationForm(pair, at){
    closeRelationForm();
    var main = document.querySelector("main");
    if (!main) return;
    var doc = currentDoc();
    var kinds = relationKindOptions(doc);
    var opts = "";
    for (var i = 0; i < kinds.length; i++) opts += '<option>' + esc(kinds[i]) + '</option>';
    var el = document.createElement("div");
    el.className = "cvn-win cvn-create-win";
    el.id = "relform-win";
    el.innerHTML =
      '<div class="insp-head"><span class="grip" aria-hidden="true" title="新建关系"></span><span class="hint">新建关系（只进暂存）</span>' +
      '<span class="insp-actions"><button class="insp-close" id="rf-close" title="关闭">×</button></span></div>' +
      '<div class="insp-body form ce-form">' +
      '<p class="hint">' + esc(pair.from) + ' ⇒ ' + esc(pair.to) + '</p>' +
      '<label>类型 kind</label><select id="rf-kind">' + opts + '</select>' +
      '<label>职责 summary（必填）</label><textarea id="rf-summary" placeholder="这条关系表达什么数据/调用？"></textarea>' +
      '<div class="cvn-create-actions"><button id="rf-create">创建</button><button type="button" id="rf-cancel">取消</button></div>' +
      '<p class="hint">创建只进暂存：导出/写回补丁并通过门禁后才真正落盘。</p>' +
      '</div>';
    main.appendChild(el);
    el.hidden = false;
    el.style.zIndex = "40";
    makeFormDraggable(el);
    var rect = main.getBoundingClientRect ? main.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = at && isFinite(at.clientX) ? at.clientX : rect.left + 80;
    var cy = at && isFinite(at.clientY) ? at.clientY : rect.top + 80;
    var maxL = (main.clientWidth || 900) - 350, maxT = (main.clientHeight || 600) - 300;
    el.style.left = Math.max(8, Math.min(cx - rect.left + 12, Math.max(8, maxL))) + "px";
    el.style.top = Math.max(8, Math.min(cy - rect.top + 10, Math.max(8, maxT))) + "px";
    document.getElementById("rf-close").addEventListener("click", function(ev){ ev.stopPropagation(); closeRelationForm(); });
    document.getElementById("rf-cancel").addEventListener("click", function(ev){ ev.stopPropagation(); closeRelationForm(); });
    document.getElementById("rf-create").addEventListener("click", function(ev){ ev.stopPropagation(); submitCreateRelation(pair); });
    var sumEl = document.getElementById("rf-summary");
    if (sumEl && sumEl.focus) sumEl.focus();
  }
  function submitCreateRelation(pair){
    var doc = currentDoc();
    if (!doc) return;
    var sumEl = document.getElementById("rf-summary");
    var summary = sumEl ? String(sumEl.value).trim() : "";
    if (!summary) { alert("summary 必填：写清这条关系表达什么"); return; }
    var kindEl = document.getElementById("rf-kind");
    var kind = kindEl ? String(kindEl.value) : "calls";
    if (!kind) kind = "calls";
    var rec = { id: newRelationId(), kind: kind, from: pair.from, to: pair.to, summary: summary };
    var st = relEditStateFor(doc);
    st.adds.push(rec);
    closeRelationForm();
    refreshRelPendingUi();
    showUndoToast("已暂存新增关系 " + pair.from + " ⇒ " + pair.to, "撤销");
    pushUndo(function(){
      var s2 = relEditStateFor(doc);
      s2.adds = s2.adds.filter(function(x){ return x.id !== rec.id; });
      refreshRelPendingUi();
    });
  }

  // —— 暂存删除关系（Delete 键；被批注引用拦截）——
  function relationDeleteBlockReason(doc, id){
    var anns = visibleAnns(doc);
    var n = 0;
    for (var i = 0; i < anns.length; i++){
      var t = anns[i].target || {};
      if (t.kind === "relation" && t.id === id) n++;
    }
    if (n) return "该关系被 " + n + " 条批注引用（含段级批注），先处理批注再删除";
    return "";
  }
  function stageToggleRelRemove(id){
    var doc = currentDoc();
    if (!doc) return;
    var st = relEditStateFor(doc);
    var idx = st.removes.indexOf(id);
    if (idx >= 0){
      st.removes.splice(idx, 1);
      refreshRelPendingUi();
      showToast("已恢复关系（撤销暂存删除）");
      return;
    }
    var addIdx = -1;
    for (var i = 0; i < st.adds.length; i++) if (st.adds[i].id === id) addIdx = i;
    if (addIdx >= 0){
      st.adds.splice(addIdx, 1);
      refreshRelPendingUi();
      showToast("已撤销新增关系");
      return;
    }
    var why = relationDeleteBlockReason(doc, id);
    if (why) { showToast(why); return; }
    st.removes.push(id);
    refreshRelPendingUi();
    showUndoToast("已暂存删除关系 " + id + "（导出时生成 remove）", "撤销");
    pushUndo(function(){
      var s2 = relEditStateFor(doc);
      s2.removes = s2.removes.filter(function(x){ return x !== id; });
      refreshRelPendingUi();
    });
  }

  // —— 事件入口（html.ts 只做一行接线：keydown 追加调用）——
  function onRelationKeydown(ev){
    var t = ev.target;
    var tag = t && t.tagName ? String(t.tagName).toUpperCase() : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
    if (ev.key !== "Delete" && ev.key !== "Backspace") return;
    if (!editing) return; /* 关系结构编辑仅限编辑模式（批注/编辑双模式） */
    if (!selected || selected.kind !== "relation") return;
    ev.preventDefault();
    stageToggleRelRemove(selected.id);
  }

  ensureRelPendingEl();

  if (DATA.docs.length) switchDoc(DATA.docs[0].key);
  setTimeout(fitView, 0);
})();
</script>
</body>
