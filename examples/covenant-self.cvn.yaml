# Covenant 自举：用自己的格式描述自己
# 目的：1) 验证 c4-container 剖面能表达真实架构 2) 把自举过程中发现的格式缺口直接记成批注
covenant: "0.1"
id: covenant/self-architecture
profile: c4-container@1

meta:
  title: Covenant 自身架构（Dogfooding）
  purpose: |
    用 Covenant 描述 Covenant 的运行架构，验证格式表达力，并把发现的缺口作为批注记录。
  non_goals: [代码模块内部结构, 部署拓扑]
  audience: [human, ai]
  status: draft
  rev: 9
  owners: [human:lily]
  updated: 2026-11-03T21:35:00+08:00
  ai:
    summary: |
      Covenant 由 CLI / MCP / serve / 浏览器标注器四类进程/端构成，权威数据是项目内 .cvn.yaml；
      CLI 与 MCP 是并列前端，都直接调用共享库层（不经 CLI 进程）；构建管线产出单文件 HTML（默认）
      与 dist/site 文件夹站点（第二模式）；写回走 patch 门禁 + write-ahead 审计。
      查看器（内联）支持多小窗并存：悬停 120ms 预览、点击固定、📌 钉住、8 色 + 400ms 色忆防闪、
      弧长锚点引导线、段级批注（target.segment）、侧栏文档分组、新增批注表单默认折叠。
      编辑态经 serve 写回，离线时导出 .patch.json / edits.json。
      本图 12 条批注已全部 resolved（2026-11-03）。
    budget_tokens: 1000

elements:
  - id: e.human
    kind: person
    name: 人工架构师
    summary: 画图、批注、评审、批准变更

  - id: e.agent
    kind: person
    name: AI Agent
    summary: 读 digest、按 ai_hint 行动、提交补丁

  - id: e.cli
    kind: container
    name: covenant CLI
    tech: Node / TypeScript
    summary: 13 个子命令入口（check/render/build/bundle/apply/patch-check/diff/index/ai/adr/edit/doctor/serve），编排共享库与构建管线
    tags: [critical]

  - id: e.mcp
    kind: container
    name: MCP Server
    tech: Node / TypeScript + JSON-RPC
    summary: stdio 进程：9 个工具（brief/check/read_doc/render/build/patch_check/apply/diff/index），直接调用共享库，不经 CLI 进程
    tags: [critical]

  - id: e.libs
    kind: container
    name: 共享库层
    tech: TypeScript（pnpm workspace）
    summary: core / profile / layout / render / indexer / ai / adr / editor；被 CLI / MCP / serve / 构建管线复用（validate 与 diff+patch 单列）
    tags: [critical]

  - id: e.validate
    kind: container
    name: 校验库（validate）
    tech: TypeScript + ajv
    summary: 共享库之一：L1 schema / L2 完整性 / L3 剖面一致性，产出稳定排序 findings
    tags: [critical]

  - id: e.diff
    kind: container
    name: 变更库（diff + patch）
    tech: TypeScript
    summary: 共享库之一：语义 diff 三分类 + 补丁门禁（base_rev/信任边界）+ 原子落盘 + write-ahead 审计
    tags: [critical]

  - id: e.builder
    kind: container
    name: 构建管线
    tech: TypeScript（layout + render）
    summary: layout+render 构建：dist/covenant.html 单文件（默认）与 dist/site/ 文件夹站点（第二模式）
    tags: [critical]

  - id: e.viewer
    kind: container
    name: 浏览器查看器
    tech: 内联 TS + SVG
    summary: 离线查看/标注：多小窗三态（悬停 120ms 预览 / 点击固定 / 📌 钉住）、8 色 + 400ms 色忆防闪、弧长锚点引导线、段级批注（target.segment）、侧栏文档分组、新增表单折叠、缩放平移、批注编辑删除撤销；编辑态经 serve 写回，离线导出补丁
    tags: [edge]

  - id: e.serve
    kind: container
    name: covenant serve
    tech: Node / HTTP
    summary: serve 模式的本地 HTTP：静态托管 + 编辑态 API（/api/edit、/api/patch）；短时、loopback、随机 token；不与 MCP 同进程；viewer 编辑态经此写回
    tags: [optional]

  - id: e.schema
    kind: datastore
    name: JSON Schema（L1 契约）
    tech: JSON
    props: { storage_kind: file }
    summary: schema/kernel.schema.json，校验器的输入，同时是仓库根锚点

  - id: e.arch
    kind: datastore
    name: .cvn 项目文件
    tech: 文件系统
    props: { storage_kind: file }
    summary: 唯一权威事实源：项目内 .cvn.yaml（arch/、examples/、用户项目）

  - id: e.audit
    kind: datastore
    name: 审计日志
    tech: JSONL 追加文件
    props: { storage_kind: file }
    summary: 手搓 write-ahead JSONL（intent→rename→commit）+ 编辑备份；git 仅用于编辑 diff 展示，不参与审计

  - id: e.dist
    kind: datastore
    name: 构建产物
    tech: HTML + SVG + JSON
    props: { storage_kind: file }
    summary: dist/：covenant.html 单文件 + site/ 文件夹站点（index.html + manifest v3 + views/*.svg + annotations.json）

  - id: e.patchfile
    kind: datastore
    name: 补丁/编辑文件
    tech: JSON
    props: { storage_kind: file }
    summary: viewer 导出的 .patch.json / edits.json；covenant apply / patch-check / edit 读取后落盘

  - id: e.llm
    kind: external-system
    name: 大模型服务
    summary: 外部推理服务：仅外部 Agent 自行调用；Covenant 自身零网络请求（无网络通道）

relations:
  - id: r.human-viewer
    kind: calls
    from: e.human
    to: e.viewer
    summary: 双击 HTML 后标注

  - id: r.agent-mcp
    kind: calls
    from: e.agent
    to: e.mcp
    summary: MCP 工具调用（brief/check/read_doc/render/build/patch_check/apply/diff/index）

  - id: r.agent-llm
    kind: calls
    from: e.agent
    to: e.llm
    summary: 可选：外部 Agent 自行调用推理；非 Covenant 运行时

  - id: r.cli-libs
    kind: calls
    from: e.cli
    to: e.libs
    summary: 编排 layout/render/indexer/ai/adr/editor 等共享库
  - id: r.cli-validate
    kind: calls
    from: e.cli
    to: e.validate
    summary: 写前校验
  - id: r.cli-diff
    kind: calls
    from: e.cli
    to: e.diff
    summary: 补丁应用与语义 diff
  - id: r.cli-builder
    kind: calls
    from: e.cli
    to: e.builder
    summary: build / bundle 子命令
  - id: r.cli-arch
    kind: reads
    from: e.cli
    to: e.arch
    summary: 读取项目文档
  - id: r.cli-arch-write
    kind: writes
    from: e.cli
    to: e.arch
    summary: apply / edit --accept 落盘（经 patch/edit-flow）
  - id: r.cli-audit
    kind: writes
    from: e.cli
    to: e.audit
    summary: edit --accept 备份与审计

  - id: r.mcp-libs
    kind: calls
    from: e.mcp
    to: e.libs
    summary: 直接调用共享库（layout/render/indexer/ai 等），不经 CLI 进程
  - id: r.mcp-validate
    kind: calls
    from: e.mcp
    to: e.validate
    summary: check 工具
  - id: r.mcp-diff
    kind: calls
    from: e.mcp
    to: e.diff
    summary: patch_check / apply / diff 工具
  - id: r.mcp-arch
    kind: reads
    from: e.mcp
    to: e.arch
    summary: read_doc / brief 读取

  - id: r.serve-libs
    kind: calls
    from: e.serve
    to: e.libs
    summary: 编辑门禁复用 validator/editor 等库
  - id: r.serve-validate
    kind: calls
    from: e.serve
    to: e.validate
    summary: 写回前 checkDocument
  - id: r.serve-diff
    kind: calls
    from: e.serve
    to: e.diff
    summary: /api/patch 走补丁门禁与原子落盘
  - id: r.serve-arch
    kind: writes
    from: e.serve
    to: e.arch
    summary: 编辑态写回（预览 diff → 确认）
  - id: r.serve-audit
    kind: writes
    from: e.serve
    to: e.audit
    summary: 备份 + audit jsonl

  - id: r.viewer-serve
    kind: calls
    from: e.viewer
    to: e.serve
    summary: 加载页面与编辑态写回 API（POST /api/edit、/api/patch）
  - id: r.viewer-dist
    kind: reads
    from: e.viewer
    to: e.dist
    summary: 加载产物内联数据与 SVG（双击 file:// 或 bundle）
  - id: r.viewer-patch
    kind: writes
    from: e.viewer
    to: e.patchfile
    summary: 导出补丁 / 编辑 JSON（离线写回通道）
  - id: r.cli-patch-read
    kind: reads
    from: e.cli
    to: e.patchfile
    summary: apply / patch-check / edit 读取补丁或编辑文件

  - id: r.validate-schema
    kind: reads
    from: e.validate
    to: e.schema
    summary: 读 schema/kernel.schema.json 做 L1 校验

  - id: r.builder-libs
    kind: calls
    from: e.builder
    to: e.libs
    summary: 使用 layout + render
  - id: r.builder-arch
    kind: reads
    from: e.builder
    to: e.arch
    summary: 编译前读取
  - id: r.builder-dist
    kind: writes
    from: e.builder
    to: e.dist
    summary: 产出单文件 HTML / 文件夹站点
  - id: r.builder-viewer
    kind: calls
    from: e.builder
    to: e.viewer
    summary: 把查看器资源内联进产物

  - id: r.diff-arch
    kind: writes
    from: e.diff
    to: e.arch
    summary: 补丁原子替换（rev+1）
  - id: r.diff-audit
    kind: writes
    from: e.diff
    to: e.audit
    summary: 记录 patch hash 与 actor（write-ahead）

views:
  - id: v.main
    title: Covenant 运行架构
    include:
      elements: [e.*]
      relations: [r.*]
    layout:
      engine: elk
      direction: RIGHT
      spacing: { rank: 120, node: 70 }
    present:
      notation: c4
      theme: covenant-light
      annotations: { status: [open], severity: [blocker, high, medium] }

annotations:
  - id: a.01JAY0S3KV01
    target: { kind: element, id: e.builder }
    type: risk
    severity: high
    title: 单文件 HTML 体积预算可能被 ELK 打爆
    body: |
      elkjs 压缩后通常 600KB–1MB，加上渲染器与样式，单文件很可能超过 500KB 目标。
      若超标，"双击本地 HTML"的首屏体验会退化（尤其机械硬盘/低端机）。
    status: "resolved"
    updated: "2026-11-03T07:15:18.119Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:18.119Z"}
    author: human:lily
    created: 2026-11-03T13:10:00+08:00
    ai_hint: |
      M1 先实测 elkjs 打进 bundle 的真实体积；若 >500KB，评估三种方案：
      (1) 构建期算好布局，HTML 只带坐标（推荐）；(2) 剪枝 ELK 算法包；(3) 放宽预算到 1MB。
      不要默认接受"打包整个 ELK"。

  - id: a.01JAY0S3KV02
    target: { kind: element, id: e.viewer }
    type: smell
    severity: medium
    title: region 批注的坐标在布局变化后会失准
    body: |
      region 批注锚定的是"视图坐标矩形"。一旦元素增删导致重新布局，
      矩形圈中的内容就变了，批注语义漂移——这是格式层的真实缺口。
    status: "resolved"
    updated: "2026-11-03T07:19:28.894Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:19:28.894Z"}
    author: human:lily
    created: 2026-11-03T13:14:00+08:00
    ai_hint: |
      评估把 region 批注改为"选中元素集合 + 可选矩形提示"（members: [id...]），
      坐标只作视觉提示、不参与语义；若改，需同步更新 format-spec §8 与 golden path Step2。

  - id: a.01JAY0S3KV03
    target: { kind: element, id: e.arch }
    type: question
    severity: medium
    title: YAML 的 Norway 问题（no → false）如何处理
    body: |
      架构图元素名里出现 `no`、`on`、`yes` 等会被 YAML 1.1 解析成布尔。
      我们的 formatter 需要决定：强制加引号？还是收紧为 YAML 1.2 core schema？
    status: "resolved"
    updated: "2026-11-03T07:15:18.119Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:18.119Z"}
    author: human:mark
    created: 2026-11-03T13:18:00+08:00
    ai_hint: |
      M1 决定：解析器统一用 YAML 1.2 core schema（`no` 保持字符串），
      并在 `covenant fmt` 对所有歧义标量加引号；写测试用例覆盖 no/on/yes/12:30/1e3。

  - id: a.01JAY0S3KV04
    target: { kind: element, id: e.validate }
    type: todo
    severity: high
    title: 规则引擎需要"可修复建议"才配得上 AI 闭环
    body: |
      golden path Step6 依赖 fix_hint 让 AI 自动纠正。若规则只报错不给修法，
      AI 只能猜，闭环退化。规则类型表需要逐条标注 fix_hint 模板。
    status: resolved
    author: human:lily
    created: 2026-11-03T13:22:00+08:00
    updated: 2026-11-03T14:05:00+08:00
    resolution:
      by: human:lily
      at: 2026-11-03T14:05:00+08:00
      ref: "docs/design/profiles-catalog-v0.md#121-fix_hint-模板gap-04-关闭"
    ai_hint: |
      已关闭：profiles-catalog §12.1 为 12 个规则类型逐条给出 fix_hint 模板与 auto_fixable 判定。
      实现时照表填模板；默认 auto_fixable=false，仅明确安全的（补必填/删失效链接）才置 true。

  - id: a.01JAY0S3KV05
    target: { kind: relation, id: r.diff-arch }
    type: risk
    severity: blocker
    title: 原子替换 + 审计同事务：崩溃点在哪
    body: |
      写入分三步（写临时文件 → 校验 → 替换），若在"替换成功、审计未写"之间崩溃，
      会出现"改了但没记录"，破坏可追溯性。
    status: "resolved"
    updated: "2026-11-03T07:15:18.119Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:18.119Z"}
    author: human:lily
    created: 2026-11-03T13:26:00+08:00
    ai_hint: |
      采用 write-ahead 审计：先写审计 intent（含 patch hash 与目标 rev），
      再落盘，最后写审计 commit。崩溃恢复时按 intent 回放或回滚。不要省这一步。

  - id: a.01JAY0S3KV06
    target: { kind: element, id: e.llm }
    type: decision
    severity: low
    title: 默认不联网是产品承诺，不是待办
    body: 渲染、校验、digest 全部本地；只有显式 `serve --ai` 才允许外发。
    status: "resolved"
    updated: "2026-11-03T07:15:18.119Z"
    resolution: {"by":"human:you","at":"2026-11-03T07:15:18.119Z"}
    author: human:lily
    created: 2026-11-03T13:30:00+08:00
    links:
      - { kind: doc, ref: "../docs/design/ai-trust-boundary.md" }
    ai_hint: 任何新增功能不得引入隐式网络请求（含字体、图标、遥测）。
  - id: "a.BBXNVV8125C9B232TK8JRZY9FC"
    target: {"kind":"element","id":"e.builder"}
    type: "question"
    severity: "medium"
    title: "html的组织"
    status: "resolved"
    updated: "2026-11-03T12:21:55.051Z"
    resolution: {"by":"human:you","at":"2026-11-03T12:21:55.051Z"}
    author: "human:you"
    created: "2026-11-03T14:40:02+08:00"
    ai_hint: "我认为架构图们不是用单个html文件全部装起来的，得用一个文件夹，把整一套打包好，请你完善设计"
  - id: "a.V0N1534KDQHD1SKVC56C9ATDEF"
    target: {"kind":"element","id":"e.llm"}
    type: "question"
    severity: "high"
    title: "什么叫大模型服务"
    body: "这个大模型服务设计在这里的目的是什么"
    status: "resolved"
    updated: "2026-11-03T11:47:15.824Z"
    resolution: {"by":"human:you","at":"2026-11-03T11:47:15.824Z"}
    author: "human:you"
    created: "2026-11-03T14:43:48+08:00"
  - id: "a.0JCN0VFAMFCPXYECX82JQR0STZ"
    target: {"kind":"relation","id":"r.diff-arch"}
    type: "question"
    severity: "medium"
    title: "我想问问你的审计是基于git写的还是手搓"
    status: "resolved"
    updated: "2026-11-03T12:21:55.051Z"
    resolution: {"by":"human:you","at":"2026-11-03T12:21:55.051Z"}
    author: "human:you"
    created: "2026-11-03T14:44:47+08:00"
  - id: "a.01K8QZ3M9V7B4X2C6D5F1G0HNP"
    target: {"kind":"element","id":"e.builder"}
    type: "decision"
    severity: "medium"
    title: "HTML 产物：单文件默认 + dist/site 文件夹第二模式"
    body: |
      对 a.BBXNVV（html 的组织）的设计答复：bundle 已实现为文件夹站点——
      dist/site/index.html（直接复用主查看器）+ manifest.json（version 3, entries）+ views/*.svg + annotations.json；
      dist/covenant.html 单文件仍是默认主路径。两者共用同一 layout+render 管线，零外部请求。
      详见 docs/design/html-output-bundle-proposal.md。
    status: "resolved"
    updated: "2026-11-03T12:21:55.051Z"
    resolution: {"by":"human:you","at":"2026-11-03T12:21:55.051Z"}
    author: "ai:arch-owner"
    created: "2026-11-03T18:45:00+08:00"
    links:
      - { kind: doc, ref: "../docs/design/html-output-bundle-proposal.md" }
  - id: "a.01K8QZ3M9V7B4X2C6D5F1G0HQR"
    target: {"kind":"element","id":"e.audit"}
    type: "decision"
    severity: "low"
    title: "审计是手搓 write-ahead JSONL，不依赖 git"
    body: |
      对 a.0JCN（审计基于 git 还是手搓）的答复：手搓。
      patch/apply.ts 先写 intent → 临时文件复验 → rename → commit（.audit/*.jsonl）；
      edit --accept 另写备份 + edit-*.jsonl。git 仅在编辑 diff 展示中可选使用（git diff --no-index），
      不参与审计与追溯。详见 docs/design/ai-trust-boundary.md §9 与 packages/patch/src/apply.ts。
    status: "resolved"
    updated: "2026-11-03T12:21:55.051Z"
    resolution: {"by":"human:you","at":"2026-11-03T12:21:55.051Z"}
    author: "ai:arch-owner"
    created: "2026-11-03T18:45:00+08:00"
    links:
      - { kind: doc, ref: "../docs/design/ai-trust-boundary.md" }
  - id: "a.A224K8DX2PQ90FZ6Q9BMZGFK38"
    target: {"kind":"relation","id":"r.human-viewer"}
    type: "risk"
    severity: "high"
    title: "为什么这个不连MCP但是线上却和AIAGENt的线有“实心圆”的交点"
    status: "resolved"
    updated: "2026-11-03T12:21:55.051Z"
    resolution: {"by":"human:you","at":"2026-11-03T12:21:55.051Z"}
    author: "human:you"
    created: "2026-11-03T19:39:06+08:00"
    ai_hint: "检查"

constraints:
  - id: k.no-cycle
    type: acyclic
    on: { kind: relation, kinds: [calls, reads, writes] }
    severity: error

  - id: k.write-target-kind
    type: implication
    if: { kind: relation, kind_is: writes }
    then: { target_element_kind_in: [datastore, queue] }
    severity: error
